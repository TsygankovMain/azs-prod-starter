worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  keepalive_timeout 65;
  client_max_body_size 25m;
  # Реальная отдача канала на части АЗС — 10–20 кбит/с, фото около 100 КБ
  # передаётся 45–80 секунд. Умолчание nginx (60 с) обрывало такую загрузку
  # на полпути, поэтому ждём тело запроса дольше клиентского таймаута (120 с).
  client_body_timeout 180s;

  server {
    listen 8080;
    server_name _;
    absolute_redirect off;
    port_in_redirect off;

    root /var/www/frontend;
    index index.html;
    error_page 405 =200 /index.html;

    location /api/ {
      proxy_pass http://127.0.0.1:8000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 180s;
      proxy_connect_timeout 60s;
      proxy_send_timeout 180s;
      # Тело запроса идёт к бэкенду по мере поступления от клиента: при узком
      # канале буферизация задерживала бы старт обработки на минуты.
      proxy_request_buffering off;
    }

    location = /install {
      error_page 405 =200 /install/index.html;
      try_files /install/index.html /index.html;
    }

    location = /install/ {
      error_page 405 =200 /install/index.html;
      try_files /install/index.html /index.html;
    }

    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
